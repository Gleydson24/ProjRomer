
{% extends 'base.html' %}

{% block content %}

<h2>{{ 'Editar Jogo' if jogo else 'Cadastrar Jogo' }}</h2>

<form method="POST">

    <label for="titulo">Título:</label>
    <br>
    <input type="text" id="titulo" name="titulo"
           value="{{ jogo.titulo if jogo else '' }}" required>

    <br><br>

    <label for="genero">Gênero:</label>
    <br>
    <input type="text" id="genero" name="genero"
           value="{{ jogo.genero if jogo else '' }}" required>

    <br><br>

    <label for="preco">Preço:</label>
    <br>
    <input type="number" id="preco" name="preco"
           step="0.01" min="0"
           value="{{ jogo.preco if jogo else '' }}" required>

    <br><br>

    <label for="categoria_id">Categoria:</label>
    <br>

    <select id="categoria_id" name="categoria_id" required>
        <option value="">Selecione uma categoria</option>

        {% for categoria in categorias %}
        <option value="{{ categoria.id }}"
            {% if jogo and jogo.categoria_id == categoria.id %}selected{% endif %}>
            {{ categoria.nome }}
        </option>
        {% endfor %}
    </select>

    <br><br>

    <button type="submit">Salvar</button>

    <a href="{{ url_for('jogo.index') }}">Cancelar</a>

</form>

{% endblock %}
