
{% extends 'base.html' %}

{% block content %}

<h2>Listagem de Jogos</h2>

<a href="{{ url_for('jogo.criar') }}">+ Novo Jogo</a>

<br><br>

<table border="1" cellpadding="10" cellspacing="0" width="100%">
    <thead>
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Gênero</th>
            <th>Preço</th>
            <th>Ações</th>
        </tr>
    </thead>

    <tbody>
        {% for jogo in jogos %}
        <tr>
            <td>{{ jogo.id }}</td>
            <td>{{ jogo.titulo }}</td>
            <td>{{ jogo.genero }}</td>
            <td>R$ {{ '%.2f'|format(jogo.preco) }}</td>
            <td>
                <a href="{{ url_for('jogo.detalhes', id=jogo.id) }}">Detalhes</a>

                <a href="{{ url_for('jogo.editar', id=jogo.id) }}">Editar</a>

                <form action="{{ url_for('jogo.excluir', id=jogo.id) }}"
                      method="POST" style="display:inline;">

                    <button type="submit"
                        onclick="return confirm('Deseja excluir este jogo?')">
                        Excluir
                    </button>
                </form>
            </td>
        </tr>

        {% else %}
        <tr>
            <td colspan="5">Nenhum jogo cadastrado.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
